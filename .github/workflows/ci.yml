# CI 파이프라인 — 정본: 설계 16 §10 [DD-16-9]
#
# 잡은 **실패 원인의 종류**로 나눈다(정적/타입/구조/로직/계약/통합/시나리오/
# 게이트/설정/공급망). 속도로 나누면 "빠른 잡만 보고 머지"하는 습관이 생기지만,
# 원인별로 나누면 실패 알림 자체가 진단이 된다.
#
# ★ 브로커 자격증명 시크릿을 이 워크플로에 노출하지 않는다(16 §1.3 원칙 1).
#   OMRA_TEST_LIVE 를 주지 않으므로 record·gate_evidence 는 물리적으로 skip된다.
#
# M0 시점 활성 잡: J1·J2·J3·J4·J10 (+ compose 검증).
# 나머지는 해당 구현 단위에서 활성화한다:
#   J5 contract     → S16-4
#   J6 integration  → S32-5
#   J7 scenario     → S39-7
#   J8 backtest gate→ S24-6
#   J9 config gate  → S05-9
#   J11 nightly     → S24-1

name: ci

on:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

env:
  HYPOTHESIS_PROFILE: ci
  OMRA_TEST_NETWORK: "blocked" # 픽스처가 읽어 소켓을 차단한다 (16 §11.2)
  PYTHONIOENCODING: "utf-8" # 계약·오류 메시지가 한국어다
  PYTHONUTF8: "1"
  UV_FROZEN: "1" # lockfile 고정 (계획 01 §7-7)

jobs:
  j1-lint:
    name: J1 lint · ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # 배포 토폴로지가 실제로 파싱되는지 — 불변식 자체는 J3(arch)가 본다.
      - name: docker compose config
        run: |
          cp .env.example .env
          cp .env.litestream.example .env.litestream
          cp .env.tools.example .env.tools
          docker compose config --quiet

  j2-typecheck:
    name: J2 typecheck · mypy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy

  j3-arch:
    name: J3 arch · import-linter + AT-*
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run lint-imports
      - run: uv run pytest -m arch -q

  j4-unit:
    name: J4 unit + property
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [j1-lint, j2-typecheck, j3-arch]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      # 반례 재현 가속 — 캐시 미스는 실패 사유가 아니다 (16 §4.3).
      - uses: actions/cache@v4
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-${{ github.sha }}
          restore-keys: hypothesis-${{ runner.os }}-
      - run: uv run pytest -m "unit or property" -q

  j10-supply-chain:
    name: J10 supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      # lockfile 이 pyproject 와 어긋나면 실패한다 — 재현성의 전제.
      - run: uv lock --check
      # 취약점 발견 시 실패시키되 **자동 업데이트 PR은 만들지 않는다**
      # (O2 = 수동 승인 배포, 계획 00 §3.2).
      - run: uv run pip-audit --strict
      # 카세트 시크릿 스캔 — 스캐너는 S16-4가 만든다. 그 전까지는 카세트가
      # 없으므로 스캔 대상도 없다 (16 §5.7).
      - name: cassette secret scan
        run: |
          if [ -f scripts/scan_cassette_secrets.py ]; then
            uv run python scripts/scan_cassette_secrets.py
          else
            echo "카세트 스캐너 미구현 — S16-4에서 활성화된다"
          fi
