name: omra

services:
  app:
    image: omra-app:${OMRA_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    env_file:
      - path: .env
        required: false
    environment:
      OMRA__RUNTIME__ROLE: app
    volumes:
      - ./config:/app/config:ro
      - omra-db:/app/var/db
      - omra-data:/app/var/data
      - omra-logs:/app/var/logs
      - omra-policy:/app/var/policy
    ports:
      - "${OMRA_BIND_ADDRESS:-127.0.0.1}:${OMRA_PORT:-8080}:8080"
    healthcheck:
      test: [CMD, python, -m, omra.cli, ready]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

  litestream:
    image: litestream/litestream:0.5.16@sha256:f085f8bce71a5ad4ce8e28b28ea522de1d9e0d7dd0af3ea5c1bd626d0f341954
    restart: unless-stopped
    stop_grace_period: 45s
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    command: [replicate, -config, /etc/litestream.yml]
    env_file:
      - path: .env.litestream
        required: false
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - omra-db:/app/var/db
      - ./config/litestream.yml:/etc/litestream.yml:ro
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

  tools:
    image: omra-app:${OMRA_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [tools]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    env_file:
      - path: .env.tools
        required: false
    environment:
      OMRA__RUNTIME__ROLE: tools
    command: [python, -m, omra.cli, --help]
    volumes:
      - ./config:/app/config:ro
      - omra-data:/app/var/data
      - omra-logs:/app/var/logs
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

volumes:
  omra-db:
  omra-data:
  omra-logs:
  omra-policy:
