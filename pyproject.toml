[project]
name = "omra"
version = "0.1.0"
description = "oh-my-robo-advisor — 자가 호스팅 자동 자산배분 운용 시스템"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# 의존성 정본: 계획 01 §1.5 핵심 라이브러리 표 + §1.2~§1.4·§2 스택.
# 버전은 uv.lock 이 고정한다 (계획 01 §7-7 "uv.lock 고정, pip-audit CI, 자동 업데이트 금지").
dependencies = [
    # ── HTTP / WebSocket — KIS·업비트 공용 (계획 01 §1.5) ──────────────
    "httpx>=0.27",
    "websockets>=13",
    # ── 웹 — FastAPI 임베디드 (계획 01 §1.2) ───────────────────────────
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "itsdangerous>=2.2",              # 세션 쿠키 서명 (13 §7.3)
    "argon2-cffi>=23.1",              # 웹 로그인 (13 §7.3)
    "python-multipart>=0.0.12",       # 폼 처리
    # ── 저장 — SQLite + Parquet/DuckDB (계획 01 §1.3) ──────────────────
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pyarrow>=18",
    "duckdb>=1.1",
    # ── 스케줄러 — 인-프로세스 APScheduler (계획 01 §1.4) ───────────────
    "apscheduler>=3.10,<4",
    # ── 도메인 모델·설정 (계획 01 §1.5) ────────────────────────────────
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-ulid>=3.0",               # [DD-02-2] new_id() 단일 진입점
    "pyyaml>=6.0",
    # ── 수치·최적화 (계획 01 §1.5) ─────────────────────────────────────
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "skfolio>=0.7",                   # BL·LW·MVO·HRP·Walk-Forward
    "quantstats>=0.0.62",             # 성과 tear sheet (사람용 전용 — 15 §12.1)
    # ── 데이터 소스 (계획 01 §1.5) ─────────────────────────────────────
    "finance-datareader>=0.9.94",
    "pykrx>=1.0.45",                  # 야간 저빈도 배치 전용 (요청당 1초 지연)
    "exchange-calendars>=4.6",        # XKRX/XNYS
    # ── 알림 (계획 01 §1.5) ────────────────────────────────────────────
    "python-telegram-bot>=21.6",
    # ── 재시도·로깅·CLI (계획 01 §1.5·§2) ──────────────────────────────
    "tenacity>=9.0",
    "structlog>=24.4",
    "typer>=0.13",
    # ── LLM — research 레이어 전용 (계획 01 §8) ────────────────────────
    "anthropic>=0.39",
]

[project.scripts]
omra = "omra.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "mypy>=1.13",
    "ruff>=0.8",
    "import-linter>=2.1",
    "pip-audit>=2.7",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omra"]

# ── pytest 최소 부트스트랩 ────────────────────────────────────────────
# 계층·마커 강제, 결정론 픽스처, hypothesis 프로파일은 S01-4가 확장한다
# (정본: 16 §2.1 [DD-16-1]·§4.3). 여기서는 S01-1의 스캐폴드 테스트가
# 실행 가능한 최소 설정만 둔다.
[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests.marks` 같은 헬퍼를 절대 import 경로로 쓰기 위해 저장소 루트를 넣는다.
pythonpath = ["."]
addopts = "--strict-markers"
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:omra.*"]
markers = [
    "unit: L1 — 순수 함수·단일 클래스",
    "property: L2 — hypothesis 불변식",
    "arch: L3 — 아키텍처 테스트",
    "contract: L4 — 카세트 재생",
    "integration: L5 — DryRun 전체 사이클 + 장애 주입",
    "scenario: L6 — 시계열 시나리오",
    "backtest_gate: L7 — 검증 게이트",
    "record: 보조 — 카세트 녹화(실호출). CI 미실행",
    "gate_evidence: 보조 — 마일스톤 게이트 증빙 수집",
    "m9: 조건부 — T1 실시간 계층",
    "verifies(*ids): 설계서 검증 항목 ID 결선 (16 §2.3)",
]

# ══════════════════════════════════════════════════════════════════════
# ruff — 정본: 16 §3.3 [DD-16-3]
#
# 룰셋 선택 기준은 "이 시스템의 알려진 실패 모드를 정적으로 잡는가"다:
#   DTZ  naive datetime          → 02 §5.4 시각 직렬화 규약
#   TID  banned-api              → 02 §8.1 [DD-02-11] Clock 주입 규율
#   S    bandit                  → 계획 01 §7 보안 목록 (특히 S105/S106 하드코딩 시크릿)
#   T20  print                   → structlog 규약 (계획 01 §1.5)
#   ASYNC 블로킹 호출            → 계획 01 §1.4 단일 루프 보호
# ══════════════════════════════════════════════════════════════════════
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# ★ 마크다운을 검사·포맷 대상에서 뺀다. ruff는 ``` 코드 펜스 안의 파이썬을
#   포맷하는데, `docs/plan`·`docs/design`의 코드 블록은 **설계 정본의 일부**이므로
#   도구가 재작성해서는 안 된다(00 §3.2 정본 위계). 설계서 안의 시그니처가
#   포매터에 의해 바뀌면 "설계서와 코드가 다르다"는 판정 자체가 무의미해진다.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E","F","W","I","N","UP","B","A","C4","DTZ","T20","PT","RET","SIM",
          "TID","ARG","PL","RUF","S","ASYNC","LOG","G","ISC","PIE","TC"]
ignore = ["PLR0913",   # 인자 수 — 도메인 팩토리·시그니처가 길다
          "S101"]      # assert — tests에서만 쓰고 src는 AT-10이 별도로 막는다

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "core.Clock을 주입해 쓴다 (설계 02 §8.1 DD-02-11)"
"datetime.date.today".msg   = "core.Clock을 주입해 쓴다 (설계 02 §8.1 DD-02-11)"
"time.sleep".msg            = "단일 asyncio 루프를 블로킹한다 (계획 01 §1.4)"
"random.random".msg         = "시드 없는 난수는 재현성을 깬다 (설계 16 §11.2)"

[tool.ruff.lint.per-file-ignores]
# 예외 이름의 정본은 설계 02 §10.1이며 `InvariantViolation`·`PretradeRejection`·
# `BrokerRateLimited`·`BrokerUnavailable`·`AmbiguousOrderState` 는 Error 접미사가
# 없는 것이 의도다 — 전자 둘은 "오류"가 아니라 각각 버그 신호와 판정 신호를
# 가리킨다. 이름을 바꾸면 설계서 16종의 인용이 전부 어긋난다.
"src/omra/core/errors.py" = ["N818"]
"src/omra/core/clock.py" = ["DTZ005","TID251"]   # Clock 구현체만 직접 호출 가능
"tests/**"               = ["S101","ARG","PLR2004","DTZ","TID251"]
"src/omra/cli/**"        = ["T20"]                # CLI 표준출력은 허용

# ══════════════════════════════════════════════════════════════════════
# mypy — 정본: 16 §3.1 [DD-16-2]
#
# "금액 계산 모듈의 타입 오류는 곧 돈"(계획 01 §1.1)이므로 strict 대상을
# 완전열거한다. 나머지 모듈도 검사 대상에서 빼지 않고 완화 baseline으로 검사한다.
# strict 섬의 공개 시그니처에 Any·float가 흘러드는 것은 AT-8이 별도로 막는다.
# ══════════════════════════════════════════════════════════════════════
[tool.mypy]
python_version = "3.12"
files = ["src/omra", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_configs   = true
warn_redundant_casts  = true
warn_unused_ignores   = true
disallow_untyped_defs = true
no_implicit_optional  = true
strict_equality       = true
show_error_codes      = true

[[tool.mypy.overrides]]                  # ★ strict 섬 — [DD-16-2] 완전열거
module = [
  "omra.core.money", "omra.core.tick", "omra.core.models", "omra.core.ids",
  "omra.core.accounts", "omra.core.states", "omra.core.errors", "omra.core.clock",
  "omra.engine.optimizer", "omra.engine.rebalancer",
  "omra.tax.*", "omra.execution.*", "omra.portfolio.*",
  "omra.protections.*", "omra.persistence.repos.*",
]
strict = true
disallow_any_unimported = true
disallow_any_explicit   = true           # 섬 안에서 Any를 '쓰겠다'는 선언조차 금지

[[tool.mypy.overrides]]                  # 외부 라이브러리 스텁 부재 (계획 01 §1.3~§1.5)
module = ["skfolio.*", "quantstats.*", "FinanceDataReader.*", "pykrx.*",
          "exchange_calendars.*", "duckdb.*", "apscheduler.*", "telegram.*",
          "ulid.*", "argon2.*", "pyarrow.*"]
ignore_missing_imports = true

# ══════════════════════════════════════════════════════════════════════
# 이하 도구 설정은 후속 구현 단위에서 채운다:
#   S01-4  [tool.pytest.ini_options] 확장   (정본: 16 §2.1·§2.3·§4.3)
# ══════════════════════════════════════════════════════════════════════
# ══════════════════════════════════════════════════════════════════════
# import-linter — 정본: 설계 01 §8.2 (계획 01 §2.2가 유일 원문)
#
# 계약은 두 층으로 나뉜다.
#   ① 기계 강제(이 파일) — `[forbidden]` 계약. **열거되지 않은 간선의 기본값은 허용**이다.
#   ② 쓰기 권한 강제(패키지 분할) — 쓰기는 `persistence.repos.*` 로만. "RO"는
#      주석이 아니라 import 가능한 모듈 집합이다.
#
# C01~C07b·C10·C11 은 계획 01 §2.2 원문의 1:1 기계 번역이다. 차이가 발견되면
# 계획이 이기고 이 파일을 고친다.
# C08·C09·C12~C15 는 각 소유 설계서가 자기부과한 추가 봉인이며(01 [DD-01-15]),
# 계획이 default-allow로 남긴 간선을 좁히기만 한다. 간선을 넓혀야 하면 계약이
# 아니라 요청 문서의 DD를 먼저 고친다.
#
# repos 모듈명의 정본은 설계 03 §2.1 트리다(24종). 03이 모듈을 추가·개명하면
# **같은 커밋에서** C04b·C05b·C07b 열거를 갱신해야 하며, 미갱신은 AT-1이 차단한다.
# ══════════════════════════════════════════════════════════════════════
[tool.importlinter]
root_packages = ["omra"]

# ── 코어 방향 규율 (계획 01 §2.2) ─────────────────────────────────────
[[tool.importlinter.contracts]]
name = "C01 engine은 brokers를 모른다"
type = "forbidden"
source_modules = ["omra.engine"]
forbidden_modules = ["omra.brokers"]

[[tool.importlinter.contracts]]
name = "C02 brokers는 전략을 모른다 [DD-01-8]"
type = "forbidden"
source_modules = ["omra.brokers"]
forbidden_modules = [
  "omra.engine", "omra.execution", "omra.tax", "omra.protections",
  "omra.portfolio", "omra.data", "omra.collectors",
  "omra.surveillance", "omra.realtime", "omra.research", "omra.labs",
  "omra.backtest", "omra.scheduler", "omra.rpc", "omra.web",
  "omra.monitoring", "omra.runtime", "omra.cli",
]

# ── collectors — 중립 프레임워크: core·audit 외 전부 금지 (계획 01 §2.2) ──
[[tool.importlinter.contracts]]
name = "C03 collectors는 core·audit만 안다"
type = "forbidden"
source_modules = ["omra.collectors"]
forbidden_modules = [
  "omra.brokers", "omra.config", "omra.calendar", "omra.data",
  "omra.engine", "omra.tax", "omra.execution", "omra.protections",
  "omra.portfolio", "omra.persistence", "omra.scheduler", "omra.rpc",
  "omra.web", "omra.research", "omra.labs", "omra.backtest",
  "omra.monitoring", "omra.surveillance", "omra.realtime", "omra.runtime",
  "omra.cli",
]

# ── research — LLM 격리 (계획 01 §2.2) ────────────────────────────────
[[tool.importlinter.contracts]]
name = "C04a research 기능 격리"
type = "forbidden"
source_modules = ["omra.research"]
forbidden_modules = [
  "omra.execution", "omra.brokers", "omra.engine", "omra.tax",
  "omra.surveillance",                       # prompt injection 격리
  "omra.protections", "omra.scheduler", "omra.web", "omra.rpc",
  "omra.backtest", "omra.labs", "omra.realtime", "omra.portfolio",
  "omra.calendar", "omra.monitoring", "omra.runtime", "omra.cli",
]

[[tool.importlinter.contracts]]
name = "C04b research 쓰기 화이트리스트 = repos.research_extractions 뿐"
type = "forbidden"
allow_indirect_imports = true   # 정당한 체인(research → repos.x → session)의 오탐 방지
# 열거 = 설계 03 §2.1 repos 트리 전체(24) − {research_extractions}. AT-1이 양방향 대조한다.
source_modules = ["omra.research"]
forbidden_modules = [
  "omra.persistence.session",                # rw 세션 금지 (§8.1 초크포인트)
  "omra.persistence.repos.approvals",
  "omra.persistence.repos.budget",
  "omra.persistence.repos.decomposition",
  "omra.persistence.repos.execution_state",
  "omra.persistence.repos.experiments",
  "omra.persistence.repos.fills",
  "omra.persistence.repos.holidays",
  "omra.persistence.repos.nav_snapshots",
  "omra.persistence.repos.notifications",
  "omra.persistence.repos.orders",
  "omra.persistence.repos.pending_tax_events",
  "omra.persistence.repos.pending_transfers",
  "omra.persistence.repos.plans",
  "omra.persistence.repos.policy_versions",
  "omra.persistence.repos.positions",
  "omra.persistence.repos.protections",
  "omra.persistence.repos.reconcile",
  "omra.persistence.repos.run_ledger",
  "omra.persistence.repos.satellite",
  "omra.persistence.repos.state",
  "omra.persistence.repos.surveillance_flags",
  "omra.persistence.repos.tax_events",
  "omra.persistence.repos.tokens",
]

# ── surveillance — 감시는 주문하지 않는다 (계획 01 §2.2) ───────────────
[[tool.importlinter.contracts]]
name = "C05a surveillance 기능 격리"
type = "forbidden"
source_modules = ["omra.surveillance"]
forbidden_modules = [
  "omra.research",                            # prompt injection 격리
  "omra.execution",
  "omra.brokers.kis.client", "omra.brokers.upbit.client",
  "omra.engine",                              # 계획 04 §2 M1이 engine 전체로 확정
  "omra.tax",
  "omra.rpc", "omra.web", "omra.labs", "omra.backtest",
  "omra.protections", "omra.scheduler", "omra.runtime",
  "omra.realtime",                            # 허용 방향은 realtime → surveillance.gate 뿐
  "omra.portfolio", "omra.monitoring", "omra.calendar", "omra.cli",
]

[[tool.importlinter.contracts]]
name = "C05b surveillance 쓰기 화이트리스트 = flags·pending_tax_events 뿐"
type = "forbidden"
allow_indirect_imports = true
# 열거 = 설계 03 §2.1 repos 트리 전체(24) − {surveillance_flags, pending_tax_events}
source_modules = ["omra.surveillance"]
forbidden_modules = [
  "omra.persistence.session",
  "omra.persistence.repos.approvals",
  "omra.persistence.repos.budget",
  "omra.persistence.repos.decomposition",
  "omra.persistence.repos.execution_state",
  "omra.persistence.repos.experiments",
  "omra.persistence.repos.fills",
  "omra.persistence.repos.holidays",
  "omra.persistence.repos.nav_snapshots",
  "omra.persistence.repos.notifications",
  "omra.persistence.repos.orders",
  # ★ pending_transfers 금지는 E7 불변식 1(계획 02 §5.6)의 기계화다 —
  #   감시는 이전 지시를 만들지 않는다.
  "omra.persistence.repos.pending_transfers",
  "omra.persistence.repos.plans",
  "omra.persistence.repos.policy_versions",
  "omra.persistence.repos.positions",
  "omra.persistence.repos.protections",
  "omra.persistence.repos.reconcile",
  "omra.persistence.repos.research_extractions",
  "omra.persistence.repos.run_ledger",
  "omra.persistence.repos.satellite",
  "omra.persistence.repos.state",
  "omra.persistence.repos.tax_events",
  "omra.persistence.repos.tokens",
]

# ── realtime — 축소 방향 전용 (계획 01 §2.2) ──────────────────────────
[[tool.importlinter.contracts]]
name = "C06a realtime 기능 격리 — 스스로 주문·조회하지 않는다"
type = "forbidden"
source_modules = ["omra.realtime"]
forbidden_modules = [
  "omra.execution",
  "omra.brokers.kis.client", "omra.brokers.upbit.client",
  "omra.engine",
  "omra.tax",
  "omra.research", "omra.labs", "omra.backtest", "omra.rpc",
  "omra.web", "omra.scheduler", "omra.protections", "omra.portfolio",
  "omra.collectors", "omra.monitoring", "omra.runtime",
  "omra.calendar", "omra.cli",
  # ★ 계획 01 §2.2의 realtime 허용은 **서브모듈 단위**다(`surveillance.gate`·`data.quote`).
  #   패키지 전체를 허용으로 두면 default-allow가 나머지 서브모듈을 조용히 열어 준다 —
  #   `surveillance.flags`는 C06b(상태 쓰기 금지) 우회 경로가 되고,
  #   `data.providers`는 "data.quote가 realtime의 유일한 REST 경로"를 무효화한다.
  "omra.surveillance.flags", "omra.surveillance.sources",
  "omra.surveillance.catalog", "omra.surveillance.models",
  "omra.data.providers", "omra.data.store", "omra.data.fetcher",
]

[[tool.importlinter.contracts]]
name = "C06b realtime은 어떤 상태도 쓰지 않는다 — persistence 전체 금지"
type = "forbidden"
source_modules = ["omra.realtime"]
forbidden_modules = ["omra.persistence"]      # ro 포함 — 허용 목록에 ro가 없다

# ── labs — 실험은 주문을 낼 수 없다 (계획 01 §2.2) ────────────────────
[[tool.importlinter.contracts]]
name = "C07a labs 기능 격리"
type = "forbidden"
source_modules = ["omra.labs"]
