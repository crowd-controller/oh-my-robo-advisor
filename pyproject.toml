[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "oh-my-robo-advisor"
version = "0.1.0"
description = "Production-grade, single-user automated personal asset management system"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "crowd-controller", email = "cgoodbye0405@gmail.com" },
]
dependencies = [
  "alembic>=1.16,<2",
  "anthropic>=0.64,<1",
  "apscheduler>=3.11,<4",
  "cryptography>=50,<51",
  "duckdb>=1.3,<2",
  "exchange-calendars>=4.11,<5",
  "fastapi>=0.116,<1",
  "finance-datareader>=0.9.96,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "pandas>=2.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyarrow>=20,<24",
  "pykrx>=1.0.51,<2",
  "python-telegram-bot>=21,<23",
  "python-ulid>=4,<5",
  "pyyaml>=6,<7",
  "quantstats>=0.0.77,<1",
  "skfolio>=0.11,<1",
  "sqlalchemy>=2.0,<3",
  "structlog>=25,<30",
  "tenacity>=9,<10",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=15,<17",
]

[project.scripts]
omra = "omra.cli:app"

[dependency-groups]
dev = [
  "coverage[toml]>=7.10,<8",
  "hypothesis>=6.138,<7",
  "import-linter>=2.3,<3",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12,<7",
]

[tool.uv]
required-version = "==0.12.5"
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/omra"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "unit: L1 pure function and isolated class tests",
  "property: L2 property-based invariant tests",
  "arch: L3 static architecture tests",
  "contract: L4 record-replay contract tests",
  "integration: L5 integration and fault-injection tests",
  "scenario: L6 time-series scenario tests",
  "backtest_gate: L7 backtest quality gates",
  "record: credentialed cassette recording; never runs in CI",
  "gate_evidence: operational gate evidence collection",
  "m9: conditional T1 real-time execution tests",
]

[tool.coverage.run]
branch = true
source = ["omra"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0

[tool.mypy]
python_version = "3.12"
files = ["src/omra", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
  "omra.core.money", "omra.core.tick", "omra.core.models", "omra.core.ids",
  "omra.core.accounts", "omra.core.states", "omra.core.errors", "omra.core.clock",
  "omra.engine.optimizer", "omra.engine.rebalancer",
  "omra.tax.*", "omra.execution.*", "omra.portfolio.*",
  "omra.protections.*", "omra.persistence.repos.*",
]
strict = true
disallow_any_unimported = true
disallow_any_explicit = true

[[tool.mypy.overrides]]
module = [
  "skfolio.*", "quantstats.*", "FinanceDataReader.*", "pykrx.*",
  "exchange_calendars.*", "duckdb.*", "apscheduler.*", "telegram.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "PT",
  "RET", "SIM", "TID", "ARG", "PL", "RUF", "S", "ASYNC", "LOG", "G", "ISC",
  "PIE", "TCH",
]
ignore = [
  "PLR0913",
  "S101",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "core.Clock을 주입해 쓴다 (02-domain-model.md §8.1 DD-02-11)"
"datetime.date.today".msg = "core.Clock을 주입해 쓴다 (02-domain-model.md §8.1 DD-02-11)"
"asyncio.sleep".msg = "core.Clock.sleep_until을 주입해 쓴다 (02-domain-model.md §8.1 DD-02-21)"
"time.sleep".msg = "단일 asyncio 루프를 블로킹한다 (01 §1.4)"
"random.random".msg = "시드 없는 난수는 재현성을 깬다 (16-testing-and-quality.md §11.2)"

[tool.ruff.lint.per-file-ignores]
"src/omra/core/clock.py" = ["DTZ005", "TID251"]
"tests/**" = ["S101", "ARG", "PLR2004", "DTZ", "TID251"]
"src/omra/cli/**" = ["T20"]

[tool.importlinter]
root_packages = ["omra"]

[[tool.importlinter.contracts]]
name = "C01 engine은 brokers를 모른다"
type = "forbidden"
source_modules = ["omra.engine"]
forbidden_modules = ["omra.brokers"]

[[tool.importlinter.contracts]]
name = "C02 brokers는 전략을 모른다 [DD-01-8]"
type = "forbidden"
