[project]
name = "omra"
version = "0.1.0"
description = "oh-my-robo-advisor — 자가 호스팅 자동 자산배분 운용 시스템"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# 의존성 정본: 계획 01 §1.5 핵심 라이브러리 표 + §1.2~§1.4·§2 스택.
# 버전은 uv.lock 이 고정한다 (계획 01 §7-7 "uv.lock 고정, pip-audit CI, 자동 업데이트 금지").
dependencies = [
    # ── HTTP / WebSocket — KIS·업비트 공용 (계획 01 §1.5) ──────────────
    "httpx>=0.27",
    "websockets>=13",
    # ── 웹 — FastAPI 임베디드 (계획 01 §1.2) ───────────────────────────
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "itsdangerous>=2.2",              # 세션 쿠키 서명 (13 §7.3)
    "argon2-cffi>=23.1",              # 웹 로그인 (13 §7.3)
    "python-multipart>=0.0.12",       # 폼 처리
    # ── 저장 — SQLite + Parquet/DuckDB (계획 01 §1.3) ──────────────────
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pyarrow>=18",
    "duckdb>=1.1",
    # ── 스케줄러 — 인-프로세스 APScheduler (계획 01 §1.4) ───────────────
    "apscheduler>=3.10,<4",
    # ── 도메인 모델·설정 (계획 01 §1.5) ────────────────────────────────
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-ulid>=3.0",               # [DD-02-2] new_id() 단일 진입점
    "pyyaml>=6.0",
    # ── 수치·최적화 (계획 01 §1.5) ─────────────────────────────────────
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "skfolio>=0.7",                   # BL·LW·MVO·HRP·Walk-Forward
    "quantstats>=0.0.62",             # 성과 tear sheet (사람용 전용 — 15 §12.1)
    # ── 데이터 소스 (계획 01 §1.5) ─────────────────────────────────────
    "finance-datareader>=0.9.94",
    "pykrx>=1.0.45",                  # 야간 저빈도 배치 전용 (요청당 1초 지연)
    "exchange-calendars>=4.6",        # XKRX/XNYS
    # ── 알림 (계획 01 §1.5) ────────────────────────────────────────────
    "python-telegram-bot>=21.6",
    # ── 재시도·로깅·CLI (계획 01 §1.5·§2) ──────────────────────────────
    "tenacity>=9.0",
    "structlog>=24.4",
    "typer>=0.13",
    # ── LLM — research 레이어 전용 (계획 01 §8) ────────────────────────
    "anthropic>=0.39",
]

[project.scripts]
omra = "omra.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "mypy>=1.13",
    "ruff>=0.8",
    "import-linter>=2.1",
    "pip-audit>=2.7",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omra"]

# ── pytest 최소 부트스트랩 ────────────────────────────────────────────
# 계층·마커 강제, 결정론 픽스처, hypothesis 프로파일은 S01-4가 확장한다
# (정본: 16 §2.1 [DD-16-1]·§4.3). 여기서는 S01-1의 스캐폴드 테스트가
# 실행 가능한 최소 설정만 둔다.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: L1 — 순수 함수·단일 클래스",
    "property: L2 — hypothesis 불변식",
    "arch: L3 — 아키텍처 테스트",
    "contract: L4 — 카세트 재생",
    "integration: L5 — DryRun 전체 사이클 + 장애 주입",
    "scenario: L6 — 시계열 시나리오",
    "backtest_gate: L7 — 검증 게이트",
    "record: 보조 — 카세트 녹화(실호출). CI 미실행",
    "gate_evidence: 보조 — 마일스톤 게이트 증빙 수집",
    "m9: 조건부 — T1 실시간 계층",
]

# ══════════════════════════════════════════════════════════════════════
# ruff — 정본: 16 §3.3 [DD-16-3]
#
# 룰셋 선택 기준은 "이 시스템의 알려진 실패 모드를 정적으로 잡는가"다:
#   DTZ  naive datetime          → 02 §5.4 시각 직렬화 규약
#   TID  banned-api              → 02 §8.1 [DD-02-11] Clock 주입 규율
#   S    bandit                  → 계획 01 §7 보안 목록 (특히 S105/S106 하드코딩 시크릿)
#   T20  print                   → structlog 규약 (계획 01 §1.5)
#   ASYNC 블로킹 호출            → 계획 01 §1.4 단일 루프 보호
# ══════════════════════════════════════════════════════════════════════
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# ★ 마크다운을 검사·포맷 대상에서 뺀다. ruff는 ``` 코드 펜스 안의 파이썬을
#   포맷하는데, `docs/plan`·`docs/design`의 코드 블록은 **설계 정본의 일부**이므로
#   도구가 재작성해서는 안 된다(00 §3.2 정본 위계). 설계서 안의 시그니처가
#   포매터에 의해 바뀌면 "설계서와 코드가 다르다"는 판정 자체가 무의미해진다.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E","F","W","I","N","UP","B","A","C4","DTZ","T20","PT","RET","SIM",
          "TID","ARG","PL","RUF","S","ASYNC","LOG","G","ISC","PIE","TC"]
ignore = ["PLR0913",   # 인자 수 — 도메인 팩토리·시그니처가 길다
          "S101"]      # assert — tests에서만 쓰고 src는 AT-10이 별도로 막는다

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "core.Clock을 주입해 쓴다 (설계 02 §8.1 DD-02-11)"
"datetime.date.today".msg   = "core.Clock을 주입해 쓴다 (설계 02 §8.1 DD-02-11)"
"time.sleep".msg            = "단일 asyncio 루프를 블로킹한다 (계획 01 §1.4)"
"random.random".msg         = "시드 없는 난수는 재현성을 깬다 (설계 16 §11.2)"

[tool.ruff.lint.per-file-ignores]
"src/omra/core/clock.py" = ["DTZ005","TID251"]   # Clock 구현체만 직접 호출 가능
"tests/**"               = ["S101","ARG","PLR2004","DTZ","TID251"]
"src/omra/cli/**"        = ["T20"]                # CLI 표준출력은 허용

# ══════════════════════════════════════════════════════════════════════
# mypy — 정본: 16 §3.1 [DD-16-2]
#
# "금액 계산 모듈의 타입 오류는 곧 돈"(계획 01 §1.1)이므로 strict 대상을
# 완전열거한다. 나머지 모듈도 검사 대상에서 빼지 않고 완화 baseline으로 검사한다.
# strict 섬의 공개 시그니처에 Any·float가 흘러드는 것은 AT-8이 별도로 막는다.
# ══════════════════════════════════════════════════════════════════════
[tool.mypy]
python_version = "3.12"
files = ["src/omra", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_configs   = true
warn_redundant_casts  = true
warn_unused_ignores   = true
disallow_untyped_defs = true
no_implicit_optional  = true
strict_equality       = true
show_error_codes      = true

[[tool.mypy.overrides]]                  # ★ strict 섬 — [DD-16-2] 완전열거
module = [
  "omra.core.money", "omra.core.tick", "omra.core.models", "omra.core.ids",
  "omra.core.accounts", "omra.core.states", "omra.core.errors", "omra.core.clock",
  "omra.engine.optimizer", "omra.engine.rebalancer",
  "omra.tax.*", "omra.execution.*", "omra.portfolio.*",
  "omra.protections.*", "omra.persistence.repos.*",
]
strict = true
disallow_any_unimported = true
disallow_any_explicit   = true           # 섬 안에서 Any를 '쓰겠다'는 선언조차 금지

[[tool.mypy.overrides]]                  # 외부 라이브러리 스텁 부재 (계획 01 §1.3~§1.5)
module = ["skfolio.*", "quantstats.*", "FinanceDataReader.*", "pykrx.*",
          "exchange_calendars.*", "duckdb.*", "apscheduler.*", "telegram.*",
          "ulid.*", "argon2.*", "pyarrow.*"]
ignore_missing_imports = true

# ══════════════════════════════════════════════════════════════════════
# 이하 도구 설정은 후속 구현 단위에서 채운다:
#   S01-3  [tool.importlinter]              (정본: 01 §8.2)
#   S01-4  [tool.pytest.ini_options] 확장   (정본: 16 §2.1·§2.3·§4.3)
# ══════════════════════════════════════════════════════════════════════
